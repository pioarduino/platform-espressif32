[platformio]
default_envs = c5-matter

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[matter]
board_build.partitions = matter.csv
build_src_filter = +<matter/> -<control/>

[control]
build_src_filter = +<control/> -<matter/>

[env:c3-matter]
extends = matter
board = esp32-c3-devkitm-1

[env:c5-matter]
extends = matter
board = esp32-c5-devkitc-1
build_flags =
    -DARDUINO_MATTER_NETWORK_WIFI

[env:h2-matter]
extends = matter
board = esp32-h2-devkitm-1
build_flags = -DEXAMPLE_MATTER_THREAD

[env:c3-control]
extends = control
board = esp32-c3-devkitm-1

[env:c5-control]
extends = control
board = esp32-c5-devkitc-1

[env:h2-control]
extends = control
board = esp32-h2-devkitm-1
