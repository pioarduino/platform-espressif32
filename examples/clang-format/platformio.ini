; PlatformIO Project Configuration File
;
; clang-format example for pioarduino / platform-espressif32
;
; Check formatting (CI):   pio run -t clangformat
; Format sources in-place: pio run -t clangformat-write
;
; See README.md for all options.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Enable clang-format for this project so the tool is installed automatically.
; Accepted values: check, write, true, 1, yes, on.
custom_clang_format = check

; Optional: directories to scan (comma separated). Relative paths are resolved
; against the project directory. Default: $PROJECT_SRC_DIR and $PROJECT_INCLUDE_DIR.
; custom_clang_format_dirs = src, include

; Optional: file extensions to scan (comma separated).
; custom_clang_format_extensions = .c, .cpp, .h, .hpp, .ino

; Optional: additional arguments passed to clang-format.
; custom_clang_format_args = --sort-includes
